{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-analytics-odata
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: analytics-odata
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- if .Values.ingress.serviceAnalyticsOdata.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceanalyticsodata
        {{- end }}
      backendRefs:
        - name: service-analytics-odata
          port: 8000
{{- end }}
