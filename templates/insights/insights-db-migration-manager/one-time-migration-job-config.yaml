{{- if and (include "cognigy-ai.insights.postgresql.enabled" .) (.Values.insights.dbMigration.enabled) (.Values.insights.dbMigration.oneTimeMigration.enabled) (.Values.insights.dbMigration.serviceAccountName) }}
{{- $dbMigration_dbSecret := include "cognigy-ai.insights.postgresql.superuser.secret" $ }}
{{- $postgresHost := "" }}
{{- if eq (include "cognigy-ai.insights.postgresql.provider" $) "external" }}
{{- $postgresHost = $.Values.insights.postgresql.external.host }}
{{- else }}
{{- $postgresHost = include "common.tplvalues.render" (dict "value" $.Values.insights.postgresql.cluster.host "context" $) }}
{{- end }}
{{/*
  Child Job spec for one-time data migrations, rendered here rather than assembled in the
  migration manager, so the namespace, database secret and pull secrets match what this chart
  deploys. Placeholders substituted at spawn time: _NAME_, _MIGRATION_NAME_.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insights-migration-job-config
  namespace: {{ $.Release.Namespace | quote }}
  {{/*
    A hook for the same reason as rbac.yaml: the Job mounts this with optional: false, so as a
    plain resource it would not exist yet and the hook pod would hang in ContainerCreating.
  */}}
  annotations:
    "helm.sh/hook": {{ $.Values.insights.dbMigration.helmHook.hook | quote }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation"
  labels:
    owner-team: gold
data:
  oneTimeMigration.yaml: |
    {{- with .Values.insights.dbMigration.oneTimeMigration }}
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: _NAME_
      namespace: {{ $.Release.Namespace | quote }}
      labels:
        owner-team: gold
        app: insights-db-migration-manager
        job-type: one-time-migration
    spec:
      backoffLimit: {{ .backoffLimit | default 0 }}
      ttlSecondsAfterFinished: {{ .ttlSecondsAfterFinished | default 3600 }}
      {{- if .activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
      {{- end }}
      template:
        metadata:
          labels:
            app: insights-db-migration-manager
            job-type: one-time-migration
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $.Values.insights.dbMigration.serviceAccountName }}
          {{- if .securityContext }}
          securityContext: {{- include "common.tplvalues.render" (dict "value" .securityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .affinity }}
          affinity: {{- include "common.tplvalues.render" (dict "value" .affinity "context" $) | nindent 12 }}
          {{- end }}
          {{- if .nodeSelector }}
          nodeSelector: {{- include "common.tplvalues.render" (dict "value" .nodeSelector "context" $) | nindent 12 }}
          {{- end }}
          {{- if .tolerations }}
          tolerations: {{- include "common.tplvalues.render" (dict "value" .tolerations "context" $) | nindent 12 }}
          {{- end }}
          {{- if .priorityClassName }}
          priorityClassName: {{ .priorityClassName }}
          {{- end }}
          containers:
            - name: one-time-migration
              image: {{ include "common.image.render" (dict "global" $.Values.global "image" $.Values.insights.dbMigration.image) }}
              resources: {{- toYaml .resources | nindent 16 }}
              env:
                - name: MIGRATION_NAME
                  value: "_MIGRATION_NAME_"
                # Child pods must not re-run schema migrations — the parent already did.
                - name: INSIGHTS_POSTGRES_DATA_MIGRATION_MODE
                  value: "disabled"
                - name: INSIGHTS_ENABLE_ONE_TIME_MIGRATION
                  value: "true"
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POSTGRES_HOST
                  value: {{ $postgresHost | quote }}
                - name: POSTGRES_PORT
                  value: {{ include "cognigy-ai.insights.postgresql.port" $ | quote }}
                - name: POSTGRES_DB
                  value: {{ $.Values.insights.postgresql.database.name | quote }}
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $dbMigration_dbSecret }}
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $dbMigration_dbSecret }}
                      key: password
                {{- if .extraEnvVars }}
                {{- include "common.tplvalues.render" (dict "value" .extraEnvVars "context" $) | nindent 16 }}
                {{- end }}
              envFrom:
                - configMapRef:
                    name: cognigy-env
              volumeMounts:
                - name: migration-job-config
                  mountPath: /etc/insights/migration-job
          volumes:
            - name: migration-job-config
              configMap:
                name: insights-migration-job-config
          {{- include "image.pullSecretsCognigy" $ | nindent 10 }}
    {{- end }}
{{- end }}
