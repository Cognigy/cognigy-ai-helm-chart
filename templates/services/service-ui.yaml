{{- $sticky := .Values.serviceUi.stickySessions | default dict }}
{{- $cookie := $sticky.cookie | default dict }}
{{- $cookieSecure := ternary $cookie.secure .Values.tls.enabled (hasKey $cookie "secure") }}
{{- $cookieSameSite := $cookie.sameSite | default "lax" }}
apiVersion: v1
kind: Service
metadata:
  name: service-ui
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app: service-ui
  annotations:
  {{- if $sticky.enabled }}
    # Keeps a browser on one pod, so index.html and the hashed assets it references come from the
    # same version while old and new pods both serve. Ingress mode only: the Gateway provider
    # ignores Service annotations (see the TraefikService in service-ui/httproute.yaml).
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: {{ $cookieSameSite | quote }}
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: {{ $cookieSecure | quote }}
  {{- end }}
  {{- if .Values.service.serviceUi.annotations }}
    {{- toYaml .Values.service.serviceUi.annotations | nindent 4 }}
  {{- end }}
spec:
  ports:
    - name: service-ui
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: service-ui
