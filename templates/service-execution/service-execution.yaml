{{- $statefulRabbitMq_secret := include "common.secretName.render" ( dict "existingSecret" $.Values.statefulRabbitMq.auth.existingSecret "defaultSecret" "cognigy-rabbitmq") }}
{{- $serviceName := "service-execution" }}
{{- with .Values.serviceExecution }}
---
{{ include "cognigy-ai.reloadableConfig.restartCoordinator.rbac" (dict "serviceName" $serviceName "ownerTeam" "aluminium" "context" $) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: aluminium
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/cognigy.git"
    "cognigy.com/source-path": "services/{{$serviceName}}"
spec:
  selector:
    matchLabels:
      app: {{ $serviceName }}
  {{- if not (and ($.Values.hpa.enabled) ($.Values.hpa.removeReplicas) ($.Values.hpa.services.serviceExecution.enabled)) }}
  replicas: {{ .replicaCount }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ $serviceName }}
      annotations:
        checksum/rabbitmq: {{ if not (lookup "v1" "Secret" $.Release.Namespace $statefulRabbitMq_secret) }}{{ $statefulRabbitMq_secret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $statefulRabbitMq_secret).data | sha256sum }}{{ end }}
        {{- if $.Values.cognigyCommonPodAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" $.Values.cognigyCommonPodAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- if .affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if or (.nodeSelector) (and ($.Values.hpa.enabled) ($.Values.hpa.useHpaNodeSelector) ($.Values.hpa.services.serviceExecution.enabled))}}
      nodeSelector:
        {{- if .nodeSelector }}
          {{- include "common.tplvalues.render" (dict "value" .nodeSelector "context" $) | nindent 8 }}
        {{- end }}
        {{- if and ($.Values.hpa.enabled) ($.Values.hpa.useHpaNodeSelector) ($.Values.hpa.services.serviceExecution.enabled) }}
          {{- include "common.tplvalues.render" (dict "value" $.Values.hpa.hpaNodeSelector "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or (.tolerations) (and ($.Values.hpa.enabled) ($.Values.hpa.useHpaTolerations) ($.Values.hpa.services.serviceExecution.enabled))}}
      tolerations: 
        {{- if or (.tolerations) }}
          {{- include "common.tplvalues.render" (dict "value" .tolerations "context" $) | nindent 8 }}
        {{- end }}
        {{- if and ($.Values.hpa.enabled) ($.Values.hpa.useHpaTolerations) ($.Values.hpa.services.serviceExecution.enabled) }}
          {{- include "common.tplvalues.render" (dict "value" $.Values.hpa.hpaTolerations "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .priorityClassName }}
      priorityClassName: {{ .priorityClassName }}
      {{- end }}
      {{- with $.Values.sidecarVM4 }}
      {{- if .enabled }}
      initContainers:
        - name: vm4-sidecar
          image: {{ include "common.image.render" (dict "global" $.Values.global "image" $.Values.serviceExecution.image) }}
          restartPolicy: Always
          command:
            - {{ .binary }}
          env:
            {{- if .extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .resources | nindent 12 }}
          ports:
            - name: vm4
              containerPort: 9000
          startupProbe:
            failureThreshold: 30
            periodSeconds: 1
            httpGet:
              path: /health
              port: 9000
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            failureThreshold: 3
            periodSeconds: 60
            timeoutSeconds: 10
      {{- end }}
      {{- end }}
      containers:
        - name: {{ $serviceName }}
          image: {{ include "common.image.render" (dict "global" $.Values.global "image" .image) }}
          resources: {{- toYaml .resources | nindent 12 }}
          env:
            {{- include "cognigy-ai.common.nodeEnv.render" (dict "context" $) | nindent 12 }}
            - name: REDIS_ENABLE_RECONNECT
              value: "true"
            - name: RABBITMQ_ENABLE_RECONNECT
              value: "true"
            - name: TRACING_ENABLED
              value: {{ $.Values.tracing.sentry.runtime.enabled | quote }}
            - name: TRACING_BASE_URL_WITH_PROTOCOL
              value: {{ $.Values.tracing.sentry.runtime.baseUrl | quote }}      
            - name: TRACING_ERRORS_ENABLED
              value: {{ $.Values.tracing.sentry.runtime.errorsEnabled | quote }}
            - name: TRACING_EVENTS_SAMPLE_RATE
              value: {{ $.Values.tracing.sentry.runtime.eventsSampleRate | quote }}
            - name: TRACING_SAMPLE_RATE
              value: {{ $.Values.tracing.sentry.runtime.sampleRate | quote }}
            - name: ENVIRONMENT
              value: {{ $.Values.tracing.environment | quote }}
            - name: COGNIGY_AI_RELEASE_VERSION
              value: {{ $.Chart.AppVersion | quote }}
            - name: FEATURE_USE_NEW_NFS
              value: {{ $.Values.migrateFS.enabled | quote }}
            - name: FEATURE_DEPRECATE_OLD_NFS
              value: {{ $.Values.migrateFS.finished | quote }}
            {{- if $.Values.logRedaction.enabled }}
            - name: LOG_REDACTION_ENABLED
              value: "true"
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OWNER_DEPLOYMENT
              value: {{ $serviceName | quote }}
            {{- if .extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8002
          volumeMounts:
            - name: rabbitmq-connection-string
              mountPath: /var/run/secrets
            {{- if not $.Values.migrateFS.finished }}
            - name: flow-modules
              mountPath: /app/flowModules
            {{- end }}
            {{- if $.Values.migrateFS.enabled }}
            - name: runtime
              mountPath: /app/extensions
              subPath: extensions
            {{- end }}
            {{- if $.Values.commonConfigs.cognigyRollout }}
            - name: cognigy-rollout
              mountPath: /config/rollout
            {{- end }}
            - name: cognigy-env-reloadable
              mountPath: /config/env
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8001
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8001
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 10
      volumes:
        {{- if not $.Values.migrateFS.finished }}
        - name: flow-modules
          persistentVolumeClaim:
            claimName: flow-modules
        {{- end }}
        {{- if $.Values.migrateFS.enabled }}
        - name: runtime
          persistentVolumeClaim:
            claimName: runtime
        {{- end }}
        - name: rabbitmq-connection-string
          secret:
            secretName: {{ $statefulRabbitMq_secret }}
            items:
              - key: connection-string
                path: rabbitmqConnectionString
        {{- if $.Values.commonConfigs.cognigyRollout }}
        - name: cognigy-rollout
          configMap:
            name: cognigy-rollout
        {{- end }}
        - name: cognigy-env-reloadable
          configMap:
            name: cognigy-env-reloadable
            items:
              - key: cognigy.yaml
                path: cognigy.yaml
      {{- include "image.pullSecretsCognigy" $ | nindent 6 }}
      serviceAccountName: {{ include "cognigy-ai.reloadableConfig.restartCoordinator.serviceAccountName" (dict "serviceName" $serviceName "context" $) }}
      securityContext:
        {{- toYaml .securityContext | nindent 8 }}
{{- end }}