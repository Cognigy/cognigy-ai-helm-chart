{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled (eq .Values.ingress.ingresController "traefik") }}
{{- if .Values.serviceProfiles.ingress.api.enabled }}
{{/*
  Temporary workaround for routing profiles API requests through service-api.
  The OpenAPI route below remains separate and is intentionally unaffected.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-profiles
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: gold
spec:
  parentRefs:
    - name: api
  rules:
    - matches:
        {{- range list "/v2.0/profiles" "/new/v2.0/profiles" "/v2.1/profiles" "/new/v2.1/profiles" }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      # Filters are applied in the listed order
      filters:
        {{- if .Values.ingress.serviceApi.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceapi
        {{- end }}
        {{- if .Values.serviceApi.serviceAuthGateway.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth-gateway-forward-auth
        {{- end }}
      backendRefs:
        - name: service-profiles
          port: 8000
{{- end }}
---
# Public OpenAPI route; intentionally no auth-gateway forward-auth middleware.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-profiles-openapi
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: gold
spec:
  parentRefs:
    - name: api
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /profiles/openapi
        - path:
            type: PathPrefix
            value: /new/profiles/openapi
      filters:
        {{- if .Values.ingress.serviceApi.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceapi
        {{- end }}
      backendRefs:
        - name: service-profiles
          port: 8000
{{- end }}
