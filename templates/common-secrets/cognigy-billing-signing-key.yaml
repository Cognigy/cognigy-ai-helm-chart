{{- /* Only create this Secret when a token is given. An empty one would block the SealedSecret of the same name. */ -}}
{{- if and (not .Values.commonSecrets.cognigyBillingSigningKey.existingSecret) .Values.commonSecrets.cognigyBillingSigningKey.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cognigy-billing-signing-key
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  key.pem: "{{ .Values.commonSecrets.cognigyBillingSigningKey.token | default "" | b64enc }}"
{{- end }}
