{{- if and (not .Values.commonSecrets.cognigySnapshotPackageEncryptionKey.existingSecret) .Values.commonSecrets.cognigySnapshotPackageEncryptionKey.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cognigy-snapshot-package-encryption-key
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  key: "{{ .Values.commonSecrets.cognigySnapshotPackageEncryptionKey.token | b64enc }}"
{{- end }}