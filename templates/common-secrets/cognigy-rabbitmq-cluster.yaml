{{- if and .Values.rabbitmqOperator.enabled .Values.rabbitmqOperator.cluster.enabled }}
{{- $rabbitmqCluster_username := .Values.rabbitmqOperator.cluster.auth.username | default "cognigy" -}}
{{- $rabbitmqCluster_secret := include "common.secretName.render" (dict "existingSecret" .Values.rabbitmqOperator.cluster.auth.existingSecret "defaultSecret" "cognigy-rabbitmq-cluster") -}}

{{- if (not .Values.rabbitmqOperator.cluster.auth.existingSecret) }}
  {{- if not (lookup "v1" "Secret" .Release.Namespace "cognigy-rabbitmq-cluster") }}
    {{- $rabbitmqCluster_password := .Values.rabbitmqOperator.cluster.auth.password | default (printf "%x" (randAlphaNum 64)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cognigy-rabbitmq-cluster
  namespace: {{ .Release.Namespace | quote }}
  labels:
    # required so the messaging-topology-operator accepts this as the User resource's importCredentialsSecret
    rabbitmq.com/topology-operator: "true"
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  # Consumed by the rabbitmq.com/v1beta1 User resource's importCredentialsSecret (templates/rabbitmq/rabbitmq-cluster.yaml)
  username: "{{ $rabbitmqCluster_username | b64enc }}"
  password: "{{ $rabbitmqCluster_password | b64enc }}"

  # Provide proper KEDA style hostname for the TriggerAuthentication.
  keda-host: "{{ "http://rabbitmq-cluster:15672/%2F" | b64enc }}"

  # Same key names/format as the cognigy-rabbitmq secret (stateful RabbitMQ), so apps can switch over by
  # pointing their existingSecret/default secret lookup at this secret instead - no template changes needed.
  connection-string: "{{ printf "amqp://%s:%s@rabbitmq-cluster:5672" $rabbitmqCluster_username $rabbitmqCluster_password | b64enc }}"
  connection-string-api: "{{ printf "http://%s:%s@rabbitmq-cluster:15672/api" $rabbitmqCluster_username $rabbitmqCluster_password | b64enc }}"
  {{- end }}
{{- end }}

{{- if (and .Values.keda.enabled (.Capabilities.APIVersions.Has "keda.sh/v1alpha1")) }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $rabbitmqCluster_secret | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  secretTargetRef:
    - parameter: host
      name: {{ $rabbitmqCluster_secret }}
      key: keda-host
    - parameter: username
      name: {{ $rabbitmqCluster_secret }}
      key: username
    - parameter: password
      name: {{ $rabbitmqCluster_secret }}
      key: password
{{- end }}
{{- end }}
