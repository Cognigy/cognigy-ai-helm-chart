{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled .Values.serviceToolkit.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-toolkit
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: api
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /toolkit
      # Filters are applied in the listed order: the path rewrite runs last so the auth-gateway sees the original URI
      filters:
        {{- if .Values.ingress.serviceApi.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceapi
        {{- end }}
        {{- if .Values.serviceApi.serviceAuthGateway.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth-gateway-forward-auth
        {{- end }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: path-rewrite-toolkit
      backendRefs:
        - name: service-toolkit
          port: 8000
{{- end }}
