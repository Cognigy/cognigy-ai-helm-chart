{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-static-files
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: static-files
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- if .Values.ingress.serviceStaticFiles.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistservicestaticfiles
        {{- end }}
      backendRefs:
        - name: service-static-files
          port: 8000
{{- end }}
