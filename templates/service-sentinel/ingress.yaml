# We are using the ingress configuration "serviceApi" from values.yaml
# as both service-api and service-sentinel both share the same host and
# use path based routing.
{{- if and (eq .Values.ingress.enabled true) (eq .Values.serviceSentinel.enabled true) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-sentinel
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    {{- if .Values.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}

    {{- $middlewares := list }}
    {{- if .Values.ingress.serviceApi.ipWhiteListMiddleware.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-ipwhitelistserviceapi@kubernetescrd" $.Release.Namespace) }}
    {{- end }}
    {{- /* Forward-auth must run after the IP allowlist. It has the auth gateway authenticate the
           caller and injects the internal JWT which service-sentinel verifies. Deliberately NOT
           applied to internal-api-ingress.yaml: the middleware strips "x-api-key", which is what
           that ingress authenticates with. */}}
    {{- if .Values.serviceApi.serviceAuthGateway.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-auth-gateway-forward-auth@kubernetescrd" $.Release.Namespace) }}
    {{- end }}
    {{- if $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares | quote }}
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if (.Values.ingress.serviceApi.tls.enabled) }}
  {{- if (.Values.ingress.serviceApi.tls.existingSecret) }}
  tls:
    - secretName: {{ .Values.ingress.serviceApi.tls.existingSecret | quote }}
  {{- else if and (.Values.ingress.serviceApi.tls.crt) (.Values.ingress.serviceApi.tls.key) }}
  tls:
    - secretName: cognigy-service-api-tls
  {{- else }}
    {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.crt }}
    {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.key }}
    {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.existingSecret }}
  {{- end }}
  {{- else }}
  {{- include "tlsCertificate.secretName.render" $ | nindent 2 }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.serviceApi.host }}
    http:
      paths:
      {{- range $path := .Values.serviceSentinel.ingress.paths }}
      - path: {{ $path }}
        pathType: Prefix
        backend:
          service:
            name: service-sentinel
            port:
              number: 8000
      {{- end }}
{{- end }}

{{- if and (eq .Values.ingress.enabled true) (eq .Values.serviceSentinel.enabled true) }}
{{- if (eq .Values.ingress.ingresController "traefik") }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: path-rewrite-sentinel
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: gold
spec:
  replacePathRegex:
    regex: ^/sentinel/(.*)
    replacement: /$1
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-sentinel-routing-key
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    {{- if .Values.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}

    {{- $middlewares := list }}
    {{- if .Values.ingress.serviceApi.ipWhiteListMiddleware.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-ipwhitelistserviceapi@kubernetescrd" $.Release.Namespace) }}
    {{- end }}
    {{- if .Values.serviceApi.serviceAuthGateway.enabled }}
    {{- $middlewares = append $middlewares (printf "%s-auth-gateway-forward-auth@kubernetescrd" $.Release.Namespace) }}
    {{- end }}
    {{- /* The prefix strip runs last, after authentication, so the auth gateway still sees the
           original /sentinel/... URI. */}}
    {{- $middlewares = append $middlewares (printf "%s-path-rewrite-sentinel@kubernetescrd" $.Release.Namespace) }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares | quote }}
spec:
  ingressClassName: traefik
  {{- if (.Values.ingress.serviceApi.tls.enabled) }}
  {{- if (.Values.ingress.serviceApi.tls.existingSecret) }}
  tls:
    - secretName: {{ .Values.ingress.serviceApi.tls.existingSecret | quote }}
  {{- else if and (.Values.ingress.serviceApi.tls.crt) (.Values.ingress.serviceApi.tls.key) }}
  tls:
    - secretName: cognigy-service-api-tls
  {{- else }}
    {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.crt }}
    {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.key }}
    {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.existingSecret }}
  {{- end }}
  {{- else }}
  {{- include "tlsCertificate.secretName.render" $ | nindent 2 }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.serviceApi.host }}
    http:
      paths:
      - path: /sentinel
        pathType: Prefix
        backend:
          service:
            name: service-sentinel
            port:
              number: 8000
{{- end }}