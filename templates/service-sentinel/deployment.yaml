{{- if .Values.serviceSentinel.enabled }}
{{- $redisHa_secret := include "common.secretName.render" ( dict "existingSecret" $.Values.redisHa.auth.existingSecret "defaultSecret" "cognigy-redis-password") }}
{{- $jwtPublicKey := include "common.secretName.render" ( dict "existingSecret" $.Values.commonSecrets.authGatewayKeyPair.existingPublicKeySecret "defaultSecret" "auth-gateway-public-key") }}
{{- $opsCenterInternalApiSecret_secret := include "common.secretName.render" ( dict "existingSecret" $.Values.commonSecrets.opsCenterInternalApiSecret.existingSecret "defaultSecret" "ops-center-internal-api-secret") }}
{{- $serviceSentinel_dbSecret := include "common.secretName.render" ( dict "existingSecret" $.Values.dbConnectionString.services.serviceSentinel.auth.existingSecret "defaultSecret" (printf "cognigy-%s" $.Values.dbConnectionString.services.serviceSentinel.serviceName)) }}
{{- $statefulRabbitMq_secret := include "common.secretName.render" ( dict "existingSecret" $.Values.statefulRabbitMq.auth.existingSecret "defaultSecret" $.Values.rabbitmq.defaultSecret) }}
{{- $serviceName := "service-sentinel" }}
{{- with .Values.serviceSentinel }}
---
{{ include "cognigy-ai.reloadableConfig.restartCoordinator.rbac" (dict "serviceName" $serviceName "existingServiceAccount" "service-sentinel" "ownerTeam" "gold" "context" $) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: gold
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/service-sentinel.git"
spec:
  selector:
    matchLabels:
      app: service-sentinel
  replicas: {{ .replicaCount }}
  template:
    metadata:
      labels:
        app: service-sentinel
      annotations:
        checksum/secret: {{ if not (lookup "v1" "Secret" $.Release.Namespace $serviceSentinel_dbSecret) }}{{ $serviceSentinel_dbSecret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $serviceSentinel_dbSecret).data | sha256sum }}{{ end }}
        checksum/jwtPublicKey: {{ if not (lookup "v1" "Secret" $.Release.Namespace $jwtPublicKey) }}{{ $jwtPublicKey | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $jwtPublicKey).data | sha256sum }}{{ end }}
        checksum/ops-center-internal-api-secret: {{ if not (lookup "v1" "Secret" $.Release.Namespace $opsCenterInternalApiSecret_secret) }}{{ $opsCenterInternalApiSecret_secret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $opsCenterInternalApiSecret_secret).data | sha256sum }}{{ end }}
        checksum/redis: {{ if not (lookup "v1" "Secret" $.Release.Namespace $redisHa_secret) }}{{ $redisHa_secret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $redisHa_secret).data | sha256sum }}{{ end }}
        checksum/rabbitmq: {{ if not (lookup "v1" "Secret" $.Release.Namespace $statefulRabbitMq_secret) }}{{ $statefulRabbitMq_secret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $statefulRabbitMq_secret).data | sha256sum }}{{ end }}
        {{- if $.Values.cognigyCommonPodAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" $.Values.cognigyCommonPodAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cognigy-ai.reloadableConfig.restartCoordinator.serviceAccountName" (dict "serviceName" $serviceName "existingServiceAccount" "service-sentinel" "context" $) }}
      {{- if .affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .priorityClassName }}
      priorityClassName: {{ .priorityClassName }}
      {{- end }}
      containers:
        - name: service-sentinel
          image: {{ include "common.image.render" (dict "global" $.Values.global "image" .image) }}
          resources: {{- toYaml .resources | nindent 12 }}
          ports:
            - name: health
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8001
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8001
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 10
          env:
            {{- include "cognigy-common.telemetry.otel.env" (dict "context" $) | nindent 12 }}
            {{- include "cognigy-ai.common.nodeEnv.render" (dict "context" $) | nindent 12 }}
            - name: DATABASE_SERVER_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $serviceSentinel_dbSecret }}
                  key: connection-string
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $statefulRabbitMq_secret }}
                  key: connection-string
            - name: AUTH_GATEWAY_JWT_PUBLIC_KEY_PATH_AND_FILENAME
              value: "/var/run/secrets/internal-auth-gateway-jwt-public-key.pem"
            - name: INTERNAL_API_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $opsCenterInternalApiSecret_secret }}
                  key: secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $redisHa_secret }}
                  key: REDIS_PASSWORD
            - name: APPLICATION_PORT
              value: "8000"
            - name: METRICS_SERVER_HOST
              value: {{ $.Values.productFeature.opsCenter.metricsServerHost }}
            - name: HEALTH_CHECK_PORT
              value: "8001"
            - name: METRICS_PORT
              value: "8002"
            - name: REDIS_ENABLE_RECONNECT
              value: "true"
            - name: RABBITMQ_ENABLE_RECONNECT
              value: "true"
            - name: DEFAULT_KUBE_PROM_STACK_CRD_CONFIG_VERSION
              value: "{{ $.Values.productFeature.opsCenter.defaultKubePromStackCrdConfigVersion }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OWNER_DEPLOYMENT
              value: {{ $serviceName | quote }}
            {{- if .extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: cognigy-env-reloadable
              mountPath: /config/env
              readOnly: true
            #
            # This configuration will get reloaded on a regular basis
            # (default is 1 minute). So we don't need to compute a checksum
            # and restart the container when the config changes!
            #
            - name: ai-ops-center-metrics-config-volume
              mountPath: /etc/config
            - name: auth-gateway-public-key
              mountPath: /var/run/secrets/internal-auth-gateway-jwt-public-key.pem
              subPath: internal-auth-gateway-jwt-public-key.pem
      volumes:
        - name: cognigy-env-reloadable
          configMap:
            name: cognigy-env-reloadable
            items:
              - key: cognigy.yaml
                path: cognigy.yaml
        - name: ai-ops-center-metrics-config-volume
          configMap:
            name: {{ default "ai-ops-center-metrics-config" .alternateMetricsConfigmap }}
        - name: auth-gateway-public-key
          secret:
            secretName: {{ $jwtPublicKey }}
            defaultMode: 420
      {{- include "image.pullSecretsCognigy" $ | nindent 6 }}
      securityContext:
        {{- toYaml .securityContext | nindent 8 }}
{{- end }}
{{- end }}
---
{{- if .Values.serviceSentinel.enabled }}
{{- $redisHa_secret := include "common.secretName.render" ( dict "existingSecret" $.Values.redisHa.auth.existingSecret "defaultSecret" "cognigy-redis-password") }}
{{- $serviceSentinel_dbSecret := include "common.secretName.render" ( dict "existingSecret" $.Values.dbConnectionString.services.serviceSentinel.auth.existingSecret "defaultSecret" (printf "cognigy-%s" $.Values.dbConnectionString.services.serviceSentinel.serviceName)) }}
{{- $statefulRabbitMq_secret := include "common.secretName.render" ( dict "existingSecret" $.Values.statefulRabbitMq.auth.existingSecret "defaultSecret" $.Values.rabbitmq.defaultSecret) }}
{{- $serviceName := "service-sentinel-crd-controller" }}
{{- with .Values.serviceSentinel }}
---
{{ include "cognigy-ai.reloadableConfig.restartCoordinator.rbac" (dict "serviceName" $serviceName "existingServiceAccount" "service-sentinel" "ownerTeam" "gold" "context" $) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: gold
  annotations:
    "cognigy.com/source-code": "git@github.com:Cognigy/service-sentinel.git"
spec:
  selector:
    matchLabels:
      app: service-sentinel-crd-controller
  replicas: 1
  template:
    metadata:
      labels:
        app: service-sentinel-crd-controller
      annotations:
        checksum/ops-center-kube-prom-crd-config: {{ (lookup "v1" "ConfigMap" $.Release.Namespace (default "ops-center-kube-prom-crd-config" .alternateKubePromCrdConfigmap)).data | toYaml | sha256sum }}
        checksum/secret: {{ if not (lookup "v1" "Secret" $.Release.Namespace $serviceSentinel_dbSecret) }}{{ $serviceSentinel_dbSecret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $serviceSentinel_dbSecret).data | sha256sum }}{{ end }}
        checksum/redis: {{ if not (lookup "v1" "Secret" $.Release.Namespace $redisHa_secret) }}{{ $redisHa_secret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $redisHa_secret).data | sha256sum }}{{ end }}
        checksum/rabbitmq: {{ if not (lookup "v1" "Secret" $.Release.Namespace $statefulRabbitMq_secret) }}{{ $statefulRabbitMq_secret | sha256sum }}{{ else }}{{ toYaml (lookup "v1" "Secret" $.Release.Namespace $statefulRabbitMq_secret).data | sha256sum }}{{ end }}
        {{- if $.Values.cognigyCommonPodAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" $.Values.cognigyCommonPodAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cognigy-ai.reloadableConfig.restartCoordinator.serviceAccountName" (dict "serviceName" $serviceName "existingServiceAccount" "service-sentinel" "context" $) }}
      {{- if .affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .priorityClassName }}
      priorityClassName: {{ .priorityClassName }}
      {{- end }}
      containers:
        - name: service-sentinel-crd-controller
          image: {{ include "common.image.render" (dict "global" $.Values.global "image" .image) }}
          resources: {{- toYaml .resources | nindent 12 }}
          command: ["node", "/app/build/crd-controller/server.js"]
          ports:
            - name: health
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8001
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8001
            failureThreshold: 3
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 10
          env:
            {{- include "cognigy-common.telemetry.otel.env" (dict "context" $) | nindent 12 }}
            {{- include "cognigy-ai.common.nodeEnv.render" (dict "context" $) | nindent 12 }}
            - name: DATABASE_SERVER_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $serviceSentinel_dbSecret }}
                  key: connection-string
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $statefulRabbitMq_secret }}
                  key: connection-string
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $redisHa_secret }}
                  key: REDIS_PASSWORD
            - name: HEALTH_CHECK_PORT
              value: "8001"
            - name: METRICS_PORT
              value: "8002"
            - name: REDIS_ENABLE_RECONNECT
              value: "true"
            - name: RABBITMQ_ENABLE_RECONNECT
              value: "true"
            - name: DEFAULT_KUBE_PROM_STACK_CRD_CONFIG_VERSION
              value: "{{ $.Values.productFeature.opsCenter.defaultKubePromStackCrdConfigVersion }}"
            - name: CRD_SYNC_INTERVAL_SECONDS
              value: "{{ $.Values.productFeature.opsCenter.crdSyncIntervalSeconds }}"
            - name: METRICS_SERVER_HOST
              value: {{ $.Values.productFeature.opsCenter.metricsServerHost }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OWNER_DEPLOYMENT
              value: {{ $serviceName | quote }}
            {{- if .extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: cognigy-env-reloadable
              mountPath: /config/env
              readOnly: true
            - name: ops-center-kube-prom-crd-config-volume
              mountPath: /etc/kube-prom-crd-config
      volumes:
        - name: cognigy-env-reloadable
          configMap:
            name: cognigy-env-reloadable
            items:
              - key: cognigy.yaml
                path: cognigy.yaml
        - name: ops-center-kube-prom-crd-config-volume
          configMap:
            name: {{ default "ops-center-kube-prom-crd-config" .alternateKubePromCrdConfigmap }}
      {{- include "image.pullSecretsCognigy" $ | nindent 6 }}
      securityContext:
        {{- toYaml .securityContext | nindent 8 }}
{{- end }}
{{- end }}