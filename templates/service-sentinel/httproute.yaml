{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled .Values.serviceSentinel.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-sentinel
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: api
  rules:
    - matches:
        {{- range $path := .Values.serviceSentinel.ingress.paths }}
        - path:
            type: PathPrefix
            value: {{ $path }}
        {{- end }}
      {{- /* Forward-auth must run after the IP allowlist. It has the auth gateway authenticate the
             caller and injects the internal JWT which service-sentinel verifies. Deliberately NOT
             applied to the internal API route: the middleware strips "x-api-key", which is what
             that route authenticates with. */}}
      filters:
        {{- if .Values.ingress.serviceApi.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceapi
        {{- end }}
        {{- if .Values.serviceApi.serviceAuthGateway.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth-gateway-forward-auth
        {{- end }}
      backendRefs:
        - name: service-sentinel
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-sentinel-routing-key
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: api
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sentinel
      {{- /* The prefix strip runs last, after authentication, so the auth gateway still sees the
             original /sentinel/... URI. */}}
      filters:
        {{- if .Values.ingress.serviceApi.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceapi
        {{- end }}
        {{- if .Values.serviceApi.serviceAuthGateway.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth-gateway-forward-auth
        {{- end }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: path-rewrite-sentinel
      backendRefs:
        - name: service-sentinel
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-sentinel-internal-api
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: api
  rules:
    - matches:
        {{- range $path := .Values.serviceSentinel.internalApiIngress.paths }}
        - path:
            type: PathPrefix
            value: {{ $path }}
        {{- end }}
      filters:
        {{- if .Values.serviceSentinel.internalApiIngress.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistinternalapiservicesentinel
        {{- end }}
      backendRefs:
        - name: service-sentinel
          port: 8000
{{- end }}
