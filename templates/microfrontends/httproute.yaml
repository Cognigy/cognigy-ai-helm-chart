{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled }}
{{- range $mfeConfig := (include "mfe.list" $ | fromJson).items }}
{{- if and $mfeConfig.values $mfeConfig.values.enabled }}
{{- $sticky := mergeOverwrite (dict) ($.Values.microfrontends.stickySessions | default dict) ($mfeConfig.values.stickySessions | default dict) }}
{{- $cookie := $sticky.cookie | default dict }}
{{- $cookieSecure := ternary $cookie.secure $.Values.tls.enabled (hasKey $cookie "secure") }}
{{- $cookieSameSite := $cookie.sameSite | default "lax" }}
{{- if $sticky.enabled }}
---
# Keeps a browser on one pod, so remoteEntry.js and the chunks it lists come from the same
# version while old and new pods both serve. Sticky sessions are configured on a TraefikService,
# as the Gateway provider ignores Service annotations.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ $mfeConfig.name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: {{ $mfeConfig.team }}
spec:
  weighted:
    services:
      - name: {{ $mfeConfig.name }}
        port: 80
        sticky:
          cookie:
            httpOnly: true
            sameSite: {{ $cookieSameSite }}
            secure: {{ $cookieSecure }}
            path: /microfrontends/{{ $mfeConfig.pathName }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $mfeConfig.name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: {{ $mfeConfig.team }}
spec:
  parentRefs:
    - name: ui
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /microfrontends/{{ $mfeConfig.pathName }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: strip-mfe-{{ $mfeConfig.pathName }}
        {{- if $.Values.ingress.serviceUi.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceui
        {{- end }}
      backendRefs:
        {{- if $sticky.enabled }}
        - group: traefik.io
          kind: TraefikService
          name: {{ $mfeConfig.name }}
        {{- else }}
        - name: {{ $mfeConfig.name }}
          port: 80
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
