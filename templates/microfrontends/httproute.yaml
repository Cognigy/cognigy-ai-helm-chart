{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled }}
{{- range $mfeConfig := (include "mfe.list" $ | fromJson).items }}
{{- if and $mfeConfig.values $mfeConfig.values.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $mfeConfig.name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: {{ $mfeConfig.team }}
spec:
  parentRefs:
    - name: ui
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /microfrontends/{{ $mfeConfig.pathName }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: strip-mfe-{{ $mfeConfig.pathName }}
        {{- if $.Values.ingress.serviceUi.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceui
        {{- end }}
      backendRefs:
        - name: {{ $mfeConfig.name }}
          port: 80
{{- end }}
{{- end }}
{{- end }}
