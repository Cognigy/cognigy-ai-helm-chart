{{- range $mfe := (include "mfe.list" $ | fromJson).items }}
{{- if and $mfe.values $mfe.values.enabled }}
{{- $rollout := mergeOverwrite (dict) ($.Values.microfrontends.rollout | default dict) ($mfe.values.rollout | default dict) }}
{{- $drainSeconds := ternary $rollout.drainSeconds 10 (hasKey $rollout "drainSeconds") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $mfe.name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: {{ $mfe.team }}
spec:
  selector:
    matchLabels:
      app: {{ $mfe.name }}
  {{- $hpaService := index $.Values.hpa.services $mfe.valuesKey | required (printf "hpa.services.%s is required for %s" $mfe.valuesKey $mfe.name) }}
  {{- if not (and $.Values.hpa.enabled $.Values.hpa.removeReplicas $hpaService.enabled) }}
  replicas: {{ $mfe.values.replicaCount }}
  {{- end }}
  # Each pod only has its own build's hashed chunks, so old and new versions must not serve one
  # browser for long: start every new pod before any old one goes (one switch-over).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ ternary $rollout.maxSurge "100%" (hasKey $rollout "maxSurge") }}
      maxUnavailable: {{ ternary $rollout.maxUnavailable 0 (hasKey $rollout "maxUnavailable") }}
  minReadySeconds: {{ ternary $rollout.minReadySeconds 10 (hasKey $rollout "minReadySeconds") }}
  template:
    metadata:
      labels:
        app: {{ $mfe.name }}
      annotations:
        {{- if $.Values.cognigyCommonPodAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" $.Values.cognigyCommonPodAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- if $mfe.values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" $mfe.values.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if $mfe.values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" $mfe.values.topologySpreadConstraints "context" $) | nindent 8 }}
      {{- end }}
      {{- if or ($mfe.values.nodeSelector) (and ($.Values.hpa.enabled) ($.Values.hpa.useHpaNodeSelector) ($hpaService.enabled)) }}
      nodeSelector:
        {{- if $mfe.values.nodeSelector }}
          {{- include "common.tplvalues.render" (dict "value" $mfe.values.nodeSelector "context" $) | nindent 8 }}
        {{- end }}
        {{- if and ($.Values.hpa.enabled) ($.Values.hpa.useHpaNodeSelector) ($hpaService.enabled) }}
          {{- include "common.tplvalues.render" (dict "value" $.Values.hpa.hpaNodeSelector "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or ($mfe.values.tolerations) (and ($.Values.hpa.enabled) ($.Values.hpa.useHpaTolerations) ($hpaService.enabled)) }}
      tolerations:
        {{- if $mfe.values.tolerations }}
          {{- include "common.tplvalues.render" (dict "value" $mfe.values.tolerations "context" $) | nindent 8 }}
        {{- end }}
        {{- if and ($.Values.hpa.enabled) ($.Values.hpa.useHpaTolerations) ($hpaService.enabled) }}
          {{- include "common.tplvalues.render" (dict "value" $.Values.hpa.hpaTolerations "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if $mfe.values.priorityClassName }}
      priorityClassName: {{ $mfe.values.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ add $drainSeconds 20 }}
      containers:
        - name: {{ $mfe.name }}
          image: {{ include "common.image.render" (dict "global" $.Values.global "image" $mfe.values.image) }}
          resources: {{- toYaml $mfe.values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 3001
          livenessProbe:
            httpGet:
              path: /remoteEntry.js
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /remoteEntry.js
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
          # A stopping pod keeps serving while Traefik takes it out of rotation, so browsers pinned
          # to it (sticky sessions) move to a new pod instead of getting a 502/504.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $drainSeconds }}
          {{- if $mfe.values.extraEnvVars }}
          env:
            {{- include "common.tplvalues.render" (dict "value" $mfe.values.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
      {{- include "image.pullSecretsCognigy" $ | nindent 6 }}
      securityContext:
        {{- toYaml $mfe.values.securityContext | nindent 8 }}
{{- end }}
{{- end }}
