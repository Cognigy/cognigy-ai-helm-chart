{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled .Values.cognigyAgentAssist.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-assist-frontend
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: agent-assist-frontend
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- if .Values.ingress.agentAssistFrontend.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistagentassistfrontend
        {{- end }}
      backendRefs:
        - name: agent-assist-frontend
          port: 8000
{{- end }}
