{{- if (.Values.ingress.serviceApi.tls.enabled) }}
{{- if not (.Values.ingress.serviceApi.tls.existingSecret) }}
{{- if and (.Values.ingress.serviceApi.tls.crt) (.Values.ingress.serviceApi.tls.key) }}
apiVersion: v1
kind: Secret
metadata:
  name: cognigy-service-api-tls
  namespace: {{ $.Release.Namespace | quote }}
type: kubernetes.io/tls
data:
  # your base64 encoded tls certificate
  tls.crt: {{ .Values.ingress.serviceApi.tls.crt | b64enc | quote }}
  # your base64 encoded private key
  tls.key: {{ .Values.ingress.serviceApi.tls.key | b64enc | quote }}
{{- else }}
  {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.crt }}
  {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.key }}
  {{ required "A valid value for .Values.ingress.serviceApi.tls is required!" .Values.ingress.serviceApi.tls.existingSecret }}
{{- end }}
{{- end }}
{{- end }}

---
{{- if and .Values.traefik.enabled .Values.ingress.enabled .Values.ingress.gatewayApi.enabled }}
#
# Gateway for the API subdomain (ingress.serviceApi.host).
# All HTTPRoutes served on the API subdomain attach to this Gateway.
#
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api
  namespace: {{ $.Release.Namespace | quote }}
spec:
  gatewayClassName: {{ .Values.traefik.gatewayClass.name }}
  listeners:
    {{- if .Values.tls.enabled }}
    - name: https
      port: {{ .Values.traefik.ports.websecure.port }}
      protocol: HTTPS
      {{- with .Values.ingress.serviceApi.host }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            {{- if .Values.ingress.serviceApi.tls.enabled }}
            name: {{ include "common.secretName.render" (dict "existingSecret" .Values.ingress.serviceApi.tls.existingSecret "defaultSecret" "cognigy-service-api-tls") | quote }}
            {{- else }}
            name: {{ tpl (include "common.secretName.render" (dict "existingSecret" .Values.tls.existingSecret "defaultSecret" "cognigy-traefik")) $ | quote }}
            {{- end }}
    {{- else }}
    - name: http
      port: {{ .Values.traefik.ports.web.port }}
      protocol: HTTP
      {{- with .Values.ingress.serviceApi.host }}
      hostname: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
