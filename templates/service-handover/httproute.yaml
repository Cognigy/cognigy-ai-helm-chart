# service-handover shares the endpoint subdomain (ingress.serviceEndpoint) with service-endpoint
# and uses path based routing.
{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-handover
  namespace: {{ $.Release.Namespace | quote }}
spec:
  parentRefs:
    - name: endpoint
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /handover
      filters:
        {{- if .Values.ingress.serviceEndpoint.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistserviceendpoint
        {{- end }}
      backendRefs:
        - name: service-handover
          port: 8000
{{- end }}
