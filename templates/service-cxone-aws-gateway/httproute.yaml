{{- if and .Values.ingress.enabled .Values.ingress.gatewayApi.enabled .Values.niceCXOne.enabled .Values.serviceCxoneAwsGateway.internalApiIngress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-cxone-aws-gateway-api
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    owner-team: boron
spec:
  parentRefs:
    - name: api
  rules:
    - matches:
        {{- range $path := .Values.serviceCxoneAwsGateway.internalApiIngress.paths }}
        - path:
            type: PathPrefix
            value: {{ $path }}
        {{- end }}
      filters:
        {{- if .Values.serviceCxoneAwsGateway.internalApiIngress.ipWhiteListMiddleware.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ipwhitelistinternalapiservicecxone
        {{- end }}
      backendRefs:
        - name: service-cxone-aws-gateway
          port: 80
{{- end }}
