{{- if .Values.mongodb.enabled }}
{{- $secrets := list
  "cognigy-service-ai"
  "cognigy-service-alexa-management"
  "cognigy-service-analytics-collector"
  "cognigy-service-analytics-conversation"
  "cognigy-service-api"
  "cognigy-service-app-session-manager"
  "cognigy-service-custom-modules"
  "cognigy-service-function-scheduler"
  "cognigy-service-handover"
  "cognigy-service-handover-inactivity"
  "cognigy-service-logs"
  "cognigy-service-nlp"
  "cognigy-service-profiles"
  "cognigy-service-resources"
  "cognigy-service-runtime-file-manager"
  "cognigy-service-security"
  "cognigy-service-task-manager"
  "cognigy-service-trainer"
  "cognigy-agent-assist"
  "cognigy-service-insights-api"
}}
{{- if .Values.serviceCollaboration.enabled }}
{{- $secrets = append $secrets "cognigy-service-collaboration" }}
{{- end }}
{{- if .Values.serviceToolkit.enabled }}
{{- $secrets = append $secrets "cognigy-service-toolkit" }}
{{- end }}
{{- if .Values.serviceSentinel.enabled }}
{{- $secrets = append $secrets "cognigy-service-sentinel" }}
{{- end }}
{{- if .Values.serviceTesting.enabled }}
{{- $secrets = append $secrets "cognigy-service-testing" }}
{{- end }}
{{- if .Values.dbConnectionString.services.serviceTestingBilling.enabled }}
{{- $secrets = append $secrets "cognigy-service-testing-billing" }}
{{- end }}
{{- if .Values.serviceUsage.enabled }}
{{- $secrets = append $secrets "cognigy-service-usage" }}
{{- end }}
{{- if .Values.dbConnectionString.services.servicePlatformAgent.enabled }}
{{- $secrets = append $secrets "cognigy-service-platform-agent" }}
{{- end }}
{{- if .Values.dbConnectionString.services.copilot.enabled }}
{{- $secrets = append $secrets "cognigy-copilot" }}
{{- end }}

{{- /* The billing user may only append simulation runs and maintain their pre-aggregation. */ -}}
{{- $customRoles := dict "cognigy-service-testing-billing" (list (dict
  "role" "billingAppendOnly"
  "privileges" (list
    (dict "resource" (dict "collection" "billingsimulationruns") "actions" (list "insert" "find" "listIndexes" "collStats" "indexStats" "createCollection"))
    (dict "resource" (dict "collection" "preAggregateBillingSimulationRuns") "actions" (list "find" "insert" "update" "createIndex" "dropIndex" "listIndexes" "collStats" "indexStats"))
    (dict "resource" (dict "collection" "") "actions" (list "createCollection" "listCollections" "find"))
  )
)) }}

{{- include "cognigy-common.mongodb.dbinit" (dict
  "context" $
  "name" "cognigy-ai"
  "image" (include "common.image.render" (dict "global" $.Values.global "image" .Values.mongodb.dbinit.image))
  "imagePullSecrets" (include "image.pullSecretsCognigy" $ | fromYaml).imagePullSecrets
  "secrets" $secrets
  "customRoles" $customRoles
  "labels" (dict "owner-team" "sre")
  "annotations" (dict "cognigy.com/source-code" "empty")
) }}
{{- end }}
